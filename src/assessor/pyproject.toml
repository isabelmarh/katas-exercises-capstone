[project]
name = "capstone-assessor"
version = "0.1.0"
description = "Capstone project assessment agent using Pydantic AI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "pydantic-ai>=0.0.14",
  "typer>=0.15.1",
  "pydantic>=2.10.5",
  "anthropic>=0.42.0",
  "rich>=13.9.4",
]

[project.scripts]
capstone-assessor = "main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
