[project]
name = "random-facts-mcp"
version = "0.1.0"
description = "MCP server for random facts, jokes, and quotes"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]