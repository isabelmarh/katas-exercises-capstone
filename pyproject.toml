[project]
name = "ai-agent-katas"
version = "0.1.0"
description = "CLI for running AI agent kata evaluations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "typer",
  "pydantic-ai",
  "pyyaml",
  "rich",
  "pydantic-evals>=1.0.1",
]

[project.scripts]
katas = "src.cli:app"

[tool.uv.workspace]
members = [
    "katas/data-glossary-audit",
    "katas/dumb-example",
    "katas/datacontract",
    "katas/punctuation",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
include = ["katas/*", "src"]
